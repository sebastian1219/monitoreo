name: Despliegue Infra Andes Motors
on:
  workflow_dispatch:
    inputs:
      aws_region:
        default: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Crear VPC y Networking (si no existe)
        run: |
          VPC_ID=$(aws ec2 describe-vpcs --filters "Name=tag:Name,Values=AndesMotors-VPC" --query "Vpcs[0].VpcId" --output text)
          if [ "$VPC_ID" == "None" ]; then
            VPC_ID=$(aws ec2 create-vpc --cidr-block 10.42.0.0/16 --query 'Vpc.VpcId' --output text)
            aws ec2 create-tags --resources $VPC_ID --tags Key=Name,Value=AndesMotors-VPC
          fi
          echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV

          SUBNET1_ID=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=AndesMotors-Subnet1" --query "Subnets[0].SubnetId" --output text)
          if [ "$SUBNET1_ID" == "None" ]; then
            SUBNET1_ID=$(aws ec2 create-subnet --vpc-id $VPC_ID --cidr-block 10.42.1.0/24 --availability-zone us-east-1a --query 'Subnet.SubnetId' --output text)
            aws ec2 create-tags --resources $SUBNET1_ID --tags Key=Name,Value=AndesMotors-Subnet1
          fi
          echo "SUBNET1_ID=$SUBNET1_ID" >> $GITHUB_ENV

          SUBNET2_ID=$(aws ec2 describe-subnets --filters "Name=tag:Name,Values=AndesMotors-Subnet2" --query "Subnets[0].SubnetId" --output text)
          if [ "$SUBNET2_ID" == "None" ]; then
            SUBNET2_ID=$(aws ec2 create-subnet --vpc-id $VPC_ID --cidr-block 10.42.2.0/24 --availability-zone us-east-1b --query 'Subnet.SubnetId' --output text)
            aws ec2 create-tags --resources $SUBNET2_ID --tags Key=Name,Value=AndesMotors-Subnet2
          fi
          echo "SUBNET2_ID=$SUBNET2_ID" >> $GITHUB_ENV

          SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=AndesMotors-SG" --query "SecurityGroups[0].GroupId" --output text)
          if [ "$SG_ID" == "None" ]; then
            SG_ID=$(aws ec2 create-security-group --group-name AndesMotors-SG --description "SG para Andes Motors" --vpc-id $VPC_ID --query 'GroupId' --output text)
            aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 22 --cidr 0.0.0.0/0
            aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 80 --cidr 0.0.0.0/0
            aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 443 --cidr 0.0.0.0/0
          fi
          echo "SG_ID=$SG_ID" >> $GITHUB_ENV

      - name: Desplegar EC2 (si no existe)
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=AndesMotors-EC2" --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ "$INSTANCE_ID" == "None" ]; then
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id ami-0b6d9d3d33ba97d99 \
              --count 1 \
              --instance-type t3.micro \
              --key-name LearnerLabKey \
              --security-group-ids $SG_ID \
              --subnet-id $SUBNET1_ID \
              --associate-public-ip-address \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=AndesMotors-EC2}]" \
              --query 'Instances[0].InstanceId' --output text)
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

      - name: Crear DB Subnet Group y RDS (si no existe)
        run: |
          DB_SUBNET_GROUP=$(aws rds describe-db-subnet-groups --db-subnet-group-name andesmotors-subnet-group --query "DBSubnetGroups[0].DBSubnetGroupName" --output text 2>/dev/null || echo "None")
          if [ "$DB_SUBNET_GROUP" == "None" ]; then
            aws rds create-db-subnet-group \
              --db-subnet-group-name andesmotors-subnet-group \
              --db-subnet-group-description "Subnets para RDS Andes Motors" \
              --subnet-ids $SUBNET1_ID $SUBNET2_ID
          fi

          DB_ID=$(aws rds describe-db-instances --db-instance-identifier andesmotors-db --query "DBInstances[0].DBInstanceIdentifier" --output text 2>/dev/null || echo "None")
          if [ "$DB_ID" == "None" ]; then
            DB_ID=$(aws rds create-db-instance \
              --db-instance-identifier andesmotors-db \
              --db-instance-class db.t3.micro \
              --engine mysql \
              --allocated-storage 20 \
              --master-username admin \
              --master-user-password Password123! \
              --vpc-security-group-ids $SG_ID \
              --db-subnet-group-name andesmotors-subnet-group \
              --query 'DBInstance.DBInstanceIdentifier' --output text)
          fi
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV

      - name: Crear Bucket S3 (si no existe)
        run: |
          BUCKET=$(aws s3api list-buckets --query "Buckets[?Name=='andesmotors-storage'].Name" --output text)
          if [ -z "$BUCKET" ]; then
            aws s3api create-bucket --bucket andesmotors-storage --region us-east-1
          fi

      - name: Configurar DNS Route 53 (si no existe)
        run: |
          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones-by-name --dns-name andesmotors.local --query "HostedZones[0].Id" --output text)
          if [ "$HOSTED_ZONE_ID" == "None" ]; then
            HOSTED_ZONE_ID=$(aws route53 create-hosted-zone --name andesmotors.local --caller-reference $(date +%s) --query 'HostedZone.Id' --output text)
          fi
          echo "HOSTED_ZONE_ID=$HOSTED_ZONE_ID" >> $GITHUB_ENV

          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          aws route53 change-resource-record-sets --hosted-zone-id $HOSTED_ZONE_ID --change-batch "{\"Changes\":[{\"Action\":\"UPSERT\",\"ResourceRecordSet\":{\"Name\":\"app.andesmotors.local\",\"Type\":\"A\",\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"$PUBLIC_IP\"}]}}]}"

