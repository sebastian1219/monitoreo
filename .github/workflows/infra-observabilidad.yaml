name: Despliegue Infra Andes Motors
on:
  workflow_dispatch:
    inputs:
      aws_region:
        default: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Crear VPC y Networking
        run: |
          VPC_ID=$(aws ec2 create-vpc --cidr-block 10.42.0.0/16 --query 'Vpc.VpcId' --output text)
          echo "VPC_ID=$VPC_ID" >> $GITHUB_ENV

          SUBNET_ID=$(aws ec2 create-subnet --vpc-id $VPC_ID --cidr-block 10.42.1.0/24 --availability-zone us-east-1a --query 'Subnet.SubnetId' --output text)
          echo "SUBNET_ID=$SUBNET_ID" >> $GITHUB_ENV

          IGW_ID=$(aws ec2 create-internet-gateway --query 'InternetGateway.InternetGatewayId' --output text)
          aws ec2 attach-internet-gateway --vpc-id $VPC_ID --internet-gateway-id $IGW_ID

          RTB_ID=$(aws ec2 create-route-table --vpc-id $VPC_ID --query 'RouteTable.RouteTableId' --output text)
          aws ec2 create-route --route-table-id $RTB_ID --destination-cidr-block 0.0.0.0/0 --gateway-id $IGW_ID
          aws ec2 associate-route-table --subnet-id $SUBNET_ID --route-table-id $RTB_ID

          SG_ID=$(aws ec2 create-security-group --group-name AndesMotors-SG --description "SG para Andes Motors" --vpc-id $VPC_ID --query 'GroupId' --output text)
          echo "SG_ID=$SG_ID" >> $GITHUB_ENV

          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 22 --cidr 0.0.0.0/0
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 80 --cidr 0.0.0.0/0
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 443 --cidr 0.0.0.0/0

      - name: Desplegar EC2 (Aplicación Andes Motors)
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ami-0b6d9d3d33ba97d99 \
            --count 1 \
            --instance-type t3.micro \
            --key-name LearnerLabKey \
            --security-group-ids $SG_ID \
            --subnet-id $SUBNET_ID \
            --associate-public-ip-address \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=AndesMotors-EC2}]" \
            --query 'Instances[0].InstanceId' --output text)
          echo "INSTANCE_ID=$INSTANCE_ID" >> $GITHUB_ENV

         aws rds create-db-subnet-group \
           --db-subnet-group-name andesmotors-subnet-group \
           --db-subnet-group-description "Subnets para RDS Andes Motors" \
           --subnet-ids $SUBNET_ID



      - name: Crear Base de Datos RDS
        run: |
          DB_ID=$(aws rds create-db-instance \
            --db-instance-identifier andesmotors-db \
            --db-instance-class db.t3.micro \
            --engine mysql \
            --allocated-storage 20 \
            --master-username admin \
            --master-user-password Password123! \
            --vpc-security-group-ids $SG_ID \
            --db-subnet-group-name andesmotors-subnet-group \
            --query 'DBInstance.DBInstanceIdentifier' --output text)
          echo "DB_ID=$DB_ID" >> $GITHUB_ENV

      - name: Crear Bucket S3
        run: |
          aws s3api create-bucket --bucket andesmotors-storage --region ${{ github.event.inputs.aws_region }} --create-bucket-configuration LocationConstraint=${{ github.event.inputs.aws_region }}

      - name: Configurar DNS Route 53
        run: |
          HOSTED_ZONE_ID=$(aws route53 create-hosted-zone --name andesmotors.local --caller-reference $(date +%s) --query 'HostedZone.Id' --output text)
          echo "HOSTED_ZONE_ID=$HOSTED_ZONE_ID" >> $GITHUB_ENV

          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          aws route53 change-resource-record-sets --hosted-zone-id $HOSTED_ZONE_ID --change-batch "{\"Changes\":[{\"Action\":\"CREATE\",\"ResourceRecordSet\":{\"Name\":\"app.andesmotors.local\",\"Type\":\"A\",\"TTL\":300,\"ResourceRecords\":[{\"Value\":\"$PUBLIC_IP\"}]}}]}"
